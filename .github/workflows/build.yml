name: Build rtlamr-hop
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o rtlamr-hop-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: rtlamr-hop-linux-amd64
          path: rtlamr-hop-linux-amd64
